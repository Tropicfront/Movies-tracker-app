services:
  movies-tracker:
    image: tropicfront/movies_tracker:latest
    build: .
    container_name: movies_tracker
    ports:
      - "8095:8095"
    environment:
      - DEBUG_SAVE_HTML=true
      - DEBUG_DATA_DIR=/app/data
      # - ALLOCINE_SALLE_CODE=P0057                # code salle AlloCiné, à ajuster si besoin
      # --- Politesse envers AlloCiné (évite les 429 et les blocages) ---
      # Requêtes max par seconde, toutes requêtes AlloCiné confondues (0.5 = 1 toutes les 2 s, 0 = illimité)
      - ALLOCINE_REQUESTS_PER_SECOND=${ALLOCINE_REQUESTS_PER_SECOND:-1}
      # Pause en secondes entre chaque titre lors de la synchro Jellyfin (en plus de la limite ci-dessus)
      - ALLOCINE_SYNC_DELAY_SECONDS=${ALLOCINE_SYNC_DELAY_SECONDS:-2}
      # --- Jellyfin (obligatoire pour la sync notes + le calendrier filtré) ---
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}
      # - JELLYFIN_USER_ID=                       # optionnel, seulement si nécessaire
      # - 'JELLYFIN_IGNORE_REGEX=\s[-–—]\s*Saga\s*$$'  # défaut ; éléments Jellyfin ignorés ($$ = $ dans compose)
      - TITLE_ALIASES_PATH=/app/data/title_aliases.json
      - TITLE_MATCH_THRESHOLD=0.85
      - CALENDAR_NAME=Pathé Toulouse Wilson (ma bibliothèque Jellyfin)
    volumes:
      - movies_tracker_data:/app/data   # volume nommé : visible dans Portainer > Volumes
    dns:
      - 1.1.1.1
      - 8.8.8.8
    restart: unless-stopped

volumes:
  movies_tracker_data:
    name: movies_tracker_data   # nom fixe (sinon Portainer/compose le préfixe du nom de la stack)
    driver: local
